[package]
name = "gitpanel"
version = "0.1.0"
edition = "2021"
description = "Zed-style git commit panel as a standalone app"
license = "MIT"
repository = "https://github.com/Yug3ne/gitpanel"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
